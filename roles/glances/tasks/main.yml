---
- name: Set glances state fact
  ansible.builtin.set_fact:
    glances_state: "{{ 'present' if glances_enabled else 'absent' }}"

- name: Build glances
  ansible.builtin.include_role:
    name: nix_build
  vars:
    nix_build_attr: "{{ glances_package }}"
    nix_build_out: "{{ glances_package_path }}"
    nix_build_state: "{{ glances_state }}"

- name: Create s6 service
  ansible.builtin.include_role:
    name: s6_service
  vars:
    s6_service_name: glances
    s6_service_command: "exec {{ glances_package_path }}/bin/glances -w"
    s6_service_create_user: false
    s6_service_state: "{{ glances_state }}"
