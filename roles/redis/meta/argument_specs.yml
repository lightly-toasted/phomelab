---
argument_specs:
  main:
    short_description: Redis
    description:
      - Open source, advanced key-value store
    seealso:
      - name: Redis
        description: Homepage
        link: https://redis.io
    options:
      redis_enabled:
        type: bool
        required: false
        default: false
        description: Enable the Redis service
      redis_package:
        type: str
        required: false
        default: nixpkgs/55ba7f49ef2962b42cbd126522b7df5f95037679#redis
        description: Nix package attribute for Redis
      redis_package_path:
        type: path
        required: false
        default: /opt/redis
        description: Nix build output path for Redis
      redis_user:
        type: str
        required: false
        default: redis
        description: System user for the Redis service
      redis_group:
        type: str
        required: false
        default: "{{ redis_user }}"
        description: System group for the Redis service
      redis_socket:
        type: path
        required: false
        default: /run/redis/redis.sock
        description: Path to the Redis Unix socket
