---
argument_specs:
  main:
    short_description: Configure automated backup services
    description:
      - Deploys scheduled backup scripts using restic and snooze.
        Each backup entry defines paths, repository, and schedule.
    options:
      backups_enabled:
        type: bool
        required: false
        default: false
        description: Enable backup services
      backups_list:
        type: list
        required: false
        description: >
          List of backup definitions. Each entry supports name,
          paths, restic_repo, exclude, restic_prune_opts,
          snooze_args, and env. See
          [`defaults/main.yml#L3-L20`](https://github.com/lightly-toasted/phomelab/blob/main/roles/backups/defaults/main.yml#L3-L20) for an example.
