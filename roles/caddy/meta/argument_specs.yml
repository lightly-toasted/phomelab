---
argument_specs:
  main:
    short_description: Configure and deploy Caddy
    description:
      - Builds Caddy from a configurable nix package attribute and creates an s6 service with a Caddyfile template.
    options:
      caddy_enabled:
        type: bool
        required: false
        default: false
        description: Enable the Caddy service
      caddy_package:
        type: str
        required: false
        default: nixpkgs/9013764fcc0ea99fa16cf7aa7decf8a5c3889dd2#caddy
        description: Nix package attribute for Caddy
      caddy_package_path:
        type: path
        required: false
        default: /opt/caddy
        description: Nix build output path for Caddy
      caddy_user:
        type: str
        required: false
        default: caddy
        description: System user for the Caddy service
      caddy_group:
        type: str
        required: false
        default: caddy
        description: System group for the Caddy service
      caddy_env:
        type: dict
        required: false
        default: {}
        description: Environment variables for the Caddy service
