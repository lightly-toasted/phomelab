---
argument_specs:
  main:
    short_description: Trilium
    description:
      - Hierarchical note taking application with focus on building large personal knowledge bases
    seealso:
      - name: Trilium
        description: Homepage
        link: https://github.com/TriliumNext/Trilium
    options:
      trilium_enabled:
        type: bool
        required: false
        default: false
        description: Enable the Trilium service
      trilium_package:
        type: str
        required: false
        default: nixpkgs/55ba7f49ef2962b42cbd126522b7df5f95037679#trilium-server
        description: Nix package attribute for Trilium
      trilium_package_path:
        type: path
        required: false
        default: /opt/trilium
        description: Nix build output path for Trilium
      trilium_user:
        type: str
        required: false
        default: trilium
        description: System user for the Trilium service
      trilium_group:
        type: str
        required: false
        default: trilium
        description: System group for the Trilium service
      trilium_data_dir:
        type: path
        required: false
        default: /var/lib/trilium
        description: Data directory for Trilium
      trilium_env:
        type: dict
        required: false
        default: {}
        description: User-provided environment variables (merged with computed defaults)
