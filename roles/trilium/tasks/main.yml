---
- name: Set Trilium state fact
  ansible.builtin.set_fact:
    trilium_state: "{{ 'present' if trilium_enabled else 'absent' }}"

- name: Build Trilium
  ansible.builtin.include_role:
    name: nix_build
  vars:
    nix_build_attr: "{{ trilium_package }}"
    nix_build_out: "{{ trilium_package_path }}"
    nix_build_state: "{{ trilium_state }}"

- name: Create s6 service
  ansible.builtin.include_role:
    name: s6_service
  vars:
    s6_service_name: trilium
    s6_service_command: "exec {{ trilium_package_path }}/bin/trilium-server"
    s6_service_user_name: "{{ trilium_user }}"
    s6_service_user_group: "{{ trilium_group }}"
    s6_service_env: "{{ trilium_env_default | combine(trilium_env, recursive=true) }}"
    s6_service_state: "{{ trilium_state }}"
