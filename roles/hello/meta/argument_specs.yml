---
argument_specs:
  main:
    short_description: GNU Hello
    description:
      - Template role for new services
      - Program that produces a familiar, friendly greeting
    seealso:
      - name: GNU Hello
        description: Homepage
        link: https://www.gnu.org/software/hello/manual/
    options:
      hello_enabled:
        type: bool
        required: false
        default: false
        description: Enable the hello service
      hello_package:
        type: str
        required: false
        default: nixpkgs/3d46470bb3030020f7e1361f33514854f5bfa86d#hello
        description: Nix package attribute for hello
      hello_package_path:
        type: path
        required: false
        default: /opt/hello
        description: Nix build output path for hello
      hello_user:
        type: str
        required: false
        default: hello
        description: System user for the hello service
      hello_group:
        type: str
        required: false
        default: hello
        description: System group for the hello service
