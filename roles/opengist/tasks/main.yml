---
- name: Set opengist state fact
  ansible.builtin.set_fact:
    opengist_state: "{{ 'present' if opengist_enabled else 'absent' }}"

- name: Check for legacy Opengist install directory
  when: opengist_enabled
  ansible.builtin.stat:
    path: "{{ opengist_package_path }}"
    follow: false
  register: opengist_package_path_stat

- name: Remove legacy Opengist install directory
  when:
    - opengist_enabled
    - opengist_package_path_stat.stat.exists
    - opengist_package_path_stat.stat.isdir | default(false)
    - not (opengist_package_path_stat.stat.islnk | default(false))
  ansible.builtin.file:
    path: "{{ opengist_package_path }}"
    state: absent

- name: Build Opengist
  ansible.builtin.include_role:
    name: nix_build
  vars:
    nix_build_attr: "{{ opengist_package }}"
    nix_build_out: "{{ opengist_package_path }}"
    nix_build_state: "{{ opengist_state }}"

- name: Create s6 service
  ansible.builtin.include_role:
    name: s6_service
  vars:
    s6_service_name: opengist
    s6_service_command: "exec {{ opengist_package_path }}/bin/opengist --config {{ opengist_config_path }} start"
    s6_service_user_name: "{{ opengist_user }}"
    s6_service_user_group: "{{ opengist_group }}"
    s6_service_user_home: "{{ opengist_data_dir }}"
    s6_service_state: "{{ opengist_state }}"

- name: Ensure Opengist directories exist
  when: opengist_enabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ opengist_user }}"
    group: "{{ opengist_group }}"
    recurse: true
  loop:
    - "{{ opengist_data_dir }}"
    - "{{ opengist_config_path | dirname }}"

- name: Create config.yml
  when: opengist_enabled
  ansible.builtin.copy:
    dest: "{{ opengist_config_path }}"
    content: "{{ opengist_config_default | combine(opengist_config, recursive=true) | to_nice_yaml }}"
    owner: "{{ opengist_user }}"
    group: "{{ opengist_group }}"
    mode: "0644"
