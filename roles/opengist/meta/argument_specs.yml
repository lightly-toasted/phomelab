---
argument_specs:
  main:
    short_description: Configure and deploy Opengist
    description:
      - Builds Opengist from a configurable nix package attribute and creates an s6 service, rendering the configuration mapping to a YAML file.
    options:
      opengist_enabled:
        type: bool
        required: false
        default: false
        description: Enable the Opengist service
      opengist_package:
        type: str
        required: false
        default: nixpkgs/55ba7f49ef2962b42cbd126522b7df5f95037679#opengist
        description: Nix package attribute for Opengist
      opengist_package_path:
        type: path
        required: false
        default: /opt/opengist
        description: Nix build output path for Opengist
      opengist_user:
        type: str
        required: false
        default: gist
        description: System user for the Opengist service
      opengist_group:
        type: str
        required: false
        default: opengist
        description: System group for the Opengist service
      opengist_data_dir:
        type: path
        required: false
        default: /var/lib/opengist
        description: Data directory for Opengist
      opengist_config:
        type: dict
        required: false
        description: Configuration for Opengist as a mapping, rendered to YAML.
          See
          [`defaults/main.yml#L12-L14`](https://github.com/lightly-toasted/phomelab/blob/main/roles/opengist/defaults/main.yml#L12-L14)
          for an example and the [upstream
          config.yml](https://github.com/thomiceli/opengist/blob/master/config.yml)
          for all options.
      opengist_config_path:
        type: path
        required: false
        default: /etc/opengist/config.yml
        description: Path to the Opengist configuration file
