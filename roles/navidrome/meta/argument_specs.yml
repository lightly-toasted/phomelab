---
argument_specs:
  main:
    short_description: Navidrome
    description:
      - Music Server and Streamer compatible with Subsonic/Airsonic
    seealso:
      - name: Navidrome
        description: Homepage
        link: https://www.navidrome.org/
    options:
      navidrome_enabled:
        type: bool
        required: false
        default: false
        description: Enable the Navidrome service
      navidrome_package:
        type: str
        required: false
        default: nixpkgs/e2ccecbf30866802b1db536246e0939eccbd7bfb#navidrome
        description: Nix package attribute for Navidrome
      navidrome_package_path:
        type: path
        required: false
        default: /opt/navidrome
        description: Nix build output path for Navidrome
      navidrome_user:
        type: str
        required: false
        default: navidrome
        description: System user for the Navidrome service
      navidrome_group:
        type: str
        required: false
        default: navidrome
        description: System group for the Navidrome service
      navidrome_port:
        type: str
        required: false
        default: "3004"
        description: TCP port for the Navidrome web interface
      navidrome_dir:
        type: path
        required: false
        default: /var/lib/navidrome
        description: Root directory for Navidrome data
      navidrome_music_dir:
        type: path
        required: false
        description: Music library directory
      navidrome_data_dir:
        type: path
        required: false
        description: Navidrome application data directory
      navidrome_cache_dir:
        type: path
        required: false
        description: Navidrome cache directory
