---
- name: Set Chhoto URL state fact
  ansible.builtin.set_fact:
    chhoto_url_state: "{{ 'present' if chhoto_url_enabled else 'absent' }}"

- name: Build Chhoto URL
  ansible.builtin.include_role:
    name: nix_build
  vars:
    nix_build_attr: "{{ chhoto_url_package }}"
    nix_build_out: "{{ chhoto_url_package_path }}"
    nix_build_state: "{{ chhoto_url_state }}"

- name: Create s6 service
  ansible.builtin.include_role:
    name: s6_service
  vars:
    s6_service_name: chhoto_url
    s6_service_command: "exec {{ chhoto_url_package_path }}/bin/chhoto-url"
    s6_service_user_name: "{{ chhoto_url_user }}"
    s6_service_user_group: "{{ chhoto_url_group }}"
    s6_service_state: "{{ chhoto_url_state }}"
    s6_service_env: "{{ chhoto_url_env_default | combine(chhoto_url_env, recursive=true) }}"

- name: Ensure Chhoto URL data directory exists
  when: chhoto_url_enabled
  ansible.builtin.file:
    path: "{{ chhoto_url_data_dir }}"
    state: directory
    owner: "{{ chhoto_url_user }}"
    group: "{{ chhoto_url_group }}"
    recurse: true
