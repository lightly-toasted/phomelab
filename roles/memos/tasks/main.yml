---
- name: Set Memos state fact
  ansible.builtin.set_fact:
    memos_state: "{{ 'present' if memos_enabled else 'absent' }}"

- name: Build Memos
  ansible.builtin.include_role:
    name: nix_build
  vars:
    nix_build_attr: "{{ memos_package }}"
    nix_build_out: "{{ memos_package_path }}"
    nix_build_state: "{{ memos_state }}"

- name: Create s6 service
  ansible.builtin.include_role:
    name: s6_service
  vars:
    s6_service_name: memos
    s6_service_command: "exec {{ memos_package_path }}/bin/memos"
    s6_service_env:
      MEMOS_DATA: "{{ memos_data_dir }}"
      MEMOS_PORT: "{{ memos_port }}"
    s6_service_state: "{{ memos_state }}"
