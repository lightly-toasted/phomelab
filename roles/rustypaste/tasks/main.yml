---
- name: Set rustypaste state fact
  ansible.builtin.set_fact:
    rustypaste_state: "{{ 'present' if rustypaste_enabled else 'absent' }}"

- name: Build rustypaste
  ansible.builtin.include_role:
    name: nix_build
  vars:
    nix_build_attr: "{{ rustypaste_package }}"
    nix_build_out: "{{ rustypaste_package_path }}"
    nix_build_state: "{{ rustypaste_state }}"

- name: Create s6 service
  ansible.builtin.include_role:
    name: s6_service
  vars:
    s6_service_name: rustypaste
    s6_service_command: "exec {{ rustypaste_package_path }}/bin/rustypaste"
    s6_service_user_name: "{{ rustypaste_user }}"
    s6_service_user_group: "{{ rustypaste_group }}"
    s6_service_state: "{{ rustypaste_state }}"
    s6_service_env:
      CONFIG: "{{ rustypaste_config_path }}"

- name: Ensure rustypaste config directory exists
  when: rustypaste_enabled
  ansible.builtin.file:
    path: "{{ rustypaste_config_path | dirname }}"
    state: directory
    owner: "{{ rustypaste_user }}"
    group: "{{ rustypaste_group }}"
    recurse: true

- name: Create config.toml
  when: rustypaste_enabled
  ansible.builtin.copy:
    dest: "{{ rustypaste_config_path }}"
    content: "{{ rustypaste_config }}"
    owner: "{{ rustypaste_user }}"
    group: "{{ rustypaste_group }}"
    mode: "0644"
