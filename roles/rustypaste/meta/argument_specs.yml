---
argument_specs:
  main:
    short_description: rustypaste
    description:
      - Minimal file upload/pastebin service
    seealso:
      - name: rustypaste
        description: Homepage
        link: https://github.com/orhun/rustypaste
    options:
      rustypaste_enabled:
        type: bool
        required: false
        default: false
        description: Enable the rustypaste service
      rustypaste_package:
        type: str
        required: false
        default: nixpkgs/55ba7f49ef2962b42cbd126522b7df5f95037679#rustypaste
        description: Nix package attribute for rustypaste
      rustypaste_package_path:
        type: path
        required: false
        default: /opt/rustypaste
        description: Nix build output path for rustypaste
      rustypaste_user:
        type: str
        required: false
        default: rustypaste
        description: System user for the rustypaste service
      rustypaste_group:
        type: str
        required: false
        default: rustypaste
        description: System group for the rustypaste service
      rustypaste_config:
        type: str
        required: false
        description: Raw TOML configuration content for rustypaste. See
          [`defaults/main.yml#L8-L89`](https://github.com/lightly-toasted/phomelab/blob/main/roles/rustypaste/defaults/main.yml#L8-L89) and [rustypaste
          config.toml](https://github.com/orhun/rustypaste/blob/master/config.toml) for an example.
      rustypaste_config_path:
        type: path
        required: false
        default: /etc/rustypaste/config.toml
        description: Path to the rustypaste configuration file
