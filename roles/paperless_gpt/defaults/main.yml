---
paperless_gpt_enabled: false
paperless_gpt_user: paperless-gpt
paperless_gpt_group: paperless-gpt
paperless_gpt_data_dir: "/var/lib/paperless-gpt"

paperless_gpt_env: # https://github.com/icereed/paperless-gpt#environment-variables
  LISTEN_INTERFACE: ":3008"
  PAPERLESS_BASE_URL: "http://localhost:{{ paperless_ngx_port }}"
  PAPERLESS_API_TOKEN: "your_paperless_api_token"

  LLM_PROVIDER: "openai"
  LLM_MODEL: "gpt-4o"
  OPENAI_API_KEY: "your_openai_api_key"

  OCR_PROVIDER: "llm"
  VISION_LLM_PROVIDER: "openai"
  VISION_LLM_MODEL: "gpt-4o"

  OCR_PROCESS_MODE: "image"
  PDF_SKIP_EXISTING_OCR: "false"

paperless_gpt_prompts: # https://github.com/icereed/paperless-gpt/tree/main/default_prompts
  "adhoc-analysis_prompt.tmpl": "{{ lookup('ansible.builtin.file', 'default_prompts/adhoc-analysis_prompt.tmpl') }}"
  "correspondent_prompt.tmpl": "{{ lookup('ansible.builtin.file', 'default_prompts/correspondent_prompt.tmpl') }}"
  "created_date_prompt.tmpl": "{{ lookup('ansible.builtin.file', 'default_prompts/created_date_prompt.tmpl') }}"
  "custom_field_prompt.tmpl": "{{ lookup('ansible.builtin.file', 'default_prompts/custom_field_prompt.tmpl') }}"
  "document_type_prompt.tmpl": "{{ lookup('ansible.builtin.file', 'default_prompts/document_type_prompt.tmpl') }}"
  "ocr_prompt.tmpl": "{{ lookup('ansible.builtin.file', 'default_prompts/ocr_prompt.tmpl') }}"
  "tag_prompt.tmpl": "{{ lookup('ansible.builtin.file', 'default_prompts/tag_prompt.tmpl') }}"
  "title_prompt.tmpl": "{{ lookup('ansible.builtin.file', 'default_prompts/title_prompt.tmpl') }}"
